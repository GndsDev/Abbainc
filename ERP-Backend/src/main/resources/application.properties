spring.application.name=erp

spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.security.username=${ERP_USER}
app.security.password=${ERP_SECURITY_PASSWORD}

app.upload.directory=${UPLOAD_DIR:uploads}
app.upload.public-url=${UPLOAD_URL:http://localhost:8080/uploads}

app.mercadopago.token=${MP_TOKEN}

app.mail.enabled=${MAIL_ENABLED}
app.mail.from=${MAIL_FROM}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

supabase.s3.endpoint=${SUPABASE_S3_ENDPOINT:https://ejkagkpcdpgtpmozevff.storage.supabase.co/storage/v1/s3}
supabase.s3.region=${SUPABASE_S3_REGION:sa-east-1}
supabase.s3.access-key=${S3_ACCESS_KEY}
supabase.s3.secret-key=${S3_SECRET_KEY}
supabase.s3.bucket=${SUPABASE_S3_BUCKET:produtos}
supabase.s3.public-url=${SUPABASE_PUBLIC_URL:https://ejkagkpcdpgtpmozevff.supabase.co/storage/v1/object/public/}
supabase.s3.max-image-size=${SUPABASE_MAX_IMAGE_SIZE:8388608}

spring.thymeleaf.prefix=classpath:/Templates/
spring.thymeleaf.check-template-location=false
