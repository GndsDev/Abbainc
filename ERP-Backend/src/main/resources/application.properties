spring.application.name=erp
spring.config.import=optional:file:.env

# ===============================
# BANCO DE DADOS (PostgreSQL / Supabase)
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===============================
# ===============================
app.security.username=${ERP_USER}
app.security.password=${ERP_SECURITY_PASSWORD}
app.cors.allowed-origin=${CORS_ORIGIN:http://127.0.0.1:5500}

# ===============================
# UPLOADS (Imagens dos Produtos)
# ===============================
app.upload.directory=${UPLOAD_DIR:uploads}
app.upload.public-url=${UPLOAD_URL:http://localhost:8080/uploads}

# ===============================
# MERCADO PAGO
# ===============================
app.mercadopago.token=${MP_TOKEN}

# ===============================
# E-MAIL (Envio de Recibos em PDF)
# ===============================
app.mail.enabled=${MAIL_ENABLED}
app.mail.from=${MAIL_FROM}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true