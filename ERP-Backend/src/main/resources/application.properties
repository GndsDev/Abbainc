spring.application.name=erp

# ===============================
# BANCO DE DADOS
# ===============================
# Se não houver DB_URL no .env, ele liga ao localhost:3306 por padrão.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/abbainc_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:admin123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===============================
# SEGURANÇA E CORS (Ligação com o Angular)
# ===============================
app.security.username=${ERP_USER:admin}
app.security.password=${ERP_SECURITY_PASSWORD}
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:4200}

# ===============================
# UPLOADS (Imagens dos Produtos)
# ===============================
# Cria automaticamente uma pasta chamada "uploads" na raiz do seu projeto
app.upload.directory=${UPLOAD_DIR:uploads}
app.upload.public-url=${UPLOAD_URL:http://localhost:8080/uploads}

# ===============================
# MERCADO PAGO
# ===============================
app.mercadopago.token=${MP_TOKEN}

# ===============================
# E-MAIL (Envio de Recibos em PDF)
# ===============================
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_USER}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true