spring.application.name=erp

# ===============================
# BANCO DE DADOS (PostgreSQL / Supabase)
# ===============================
# Alterado para o formato e motor do PostgreSQL, lendo as variáveis corretas do .env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===============================
# SEGURANÇA E CORS (Ligação com o Angular)
# ===============================
app.security.username=${ERP_USER}
app.security.password=${ERP_SECURITY_PASSWORD}
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:4200}

# ===============================
# UPLOADS (Imagens dos Produtos)
# ===============================
app.upload.directory=${UPLOAD_DIR:uploads}
app.upload.public-url=${UPLOAD_URL:http://localhost:8080/uploads}

# ===============================
# MERCADO PAGO
# ===============================
app.mercadopago.token=${MP_TOKEN}

# ===============================
# E-MAIL (Envio de Recibos em PDF)
# ===============================
app.mail.enabled=${MAIL_ENABLED}
app.mail.from=${MAIL_FROM}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true