spring.application.name=erp

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/abbainc_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.security.username=${ERP_SECURITY_USER:admin}
app.security.password=${ERP_SECURITY_PASSWORD:@Senhaforte9624}
app.cors.allowed-origin=${ERP_CORS_ALLOWED_ORIGIN:http://localhost:4200}
app.upload.directory=${UPLOAD_DIR:uploads}
app.upload.public-url=${UPLOAD_PUBLIC_URL:http://localhost:8080/uploads}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@abbainc.com}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
