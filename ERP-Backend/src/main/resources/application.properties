spring.application.name=erp

spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.security.username=${ERP_USER}
app.security.password=${ERP_SECURITY_PASSWORD}

app.upload.directory=${UPLOAD_DIR:uploads}
app.upload.public-url=${UPLOAD_URL:http://localhost:8080/uploads}

app.mercadopago.token=${MP_TOKEN}

app.mail.enabled=${MAIL_ENABLED}
app.mail.from=${MAIL_FROM}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

supabase.s3.endpoint=https://ejkagkpcdpgtpmozevff.storage.supabase.co/storage/v1/s3
supabase.s3.region=sa-east-1
supabase.s3.access-key=${S3_ACCESS_KEY}
supabase.s3.secret-key=${S3_SECRET_KEY}
supabase.s3.bucket=produtos
supabase.s3.public-url=https://ejkagkpcdpgtpmozevff.supabase.co/storage/v1/object/public/

spring.thymeleaf.prefix=classpath:/Templates/
spring.thymeleaf.check-template-location=false
